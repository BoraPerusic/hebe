[versions]
kotlin              = "2.3.20"
coroutines          = "1.10.2"
serialization       = "1.11.0"
datetime            = "0.7.1"
koog                = "0.8.0"
ktor                = "3.2.3"
mcp                 = "0.12.0"
kotlinx-io          = "0.8.2"
sqliteJdbc          = "3.53.0.0"
sqliteVec           = "0.1.8"
flyway              = "11.20.3"
telegram            = "9.6.0"
jgit                = "6.10.0.202406032230-r"
bouncycastle        = "1.84"
pf4j                = "3.15.0"
oras                = "0.6.0"
tomlj               = "1.1.1"
kotlinLogging       = "8.0.02"
logback             = "1.5.26"
otel                = "1.58.0"
junit               = "5.11.0"
kotest              = "6.1.2"
mockk               = "1.14.9"
testcontainers      = "2.0.3"
detekt              = "1.23.8"
ktlint              = "14.2.0"
shadow              = "9.4.1"
clikt               = "5.0.0"
jline               = "4.1.0"
logstashEncoder     = "8.1"

[libraries]
kotlinx-coroutines-core   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",     version.ref = "coroutines" }
kotlinx-coroutines-test   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",     version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime          = { module = "org.jetbrains.kotlinx:kotlinx-datetime",            version.ref = "datetime" }
koog-agents                 = { module = "ai.koog:koog-agents-jvm",                         version.ref = "koog" }
koog-core                  = { module = "ai.koog:koog-agents-core-jvm",                      version.ref = "koog" }
koog-utils                 = { module = "ai.koog:utils-jvm",                               version.ref = "koog" }
koog-utils-common          = { module = "ai.koog:utils",                                    version.ref = "koog" }
koog-tools                 = { module = "ai.koog:koog-agents-tools-jvm",                    version.ref = "koog" }
koog-ktor                 = { module = "ai.koog:http-client-ktor-jvm",                      version.ref = "koog" }
koog-prompt                 = { module = "ai.koog:prompt-llm-jvm",                          version.ref = "koog" }
ktor-server-core           = { module = "io.ktor:ktor-server-core",                         version.ref = "ktor" }
ktor-server-netty         = { module = "io.ktor:ktor-server-netty",                         version.ref = "ktor" }
ktor-server-cnegot         = { module = "io.ktor:ktor-server-content-negotiation",          version.ref = "ktor" }
ktor-server-sse           = { module = "io.ktor:ktor-server-sse",                           version.ref = "ktor" }
ktor-server-websockets    = { module = "io.ktor:ktor-server-websockets",                    version.ref = "ktor" }
ktor-server-test-host     = { module = "io.ktor:ktor-server-test-host",                    version.ref = "ktor" }
ktor-server-auth           = { module = "io.ktor:ktor-server-auth",                         version.ref = "ktor" }
ktor-server-cors           = { module = "io.ktor:ktor-server-cors",                         version.ref = "ktor" }
ktor-serialization-json   = { module = "io.ktor:ktor-serialization-kotlinx-json",           version.ref = "ktor" }
ktor-client-core          = { module = "io.ktor:ktor-client-core",                          version.ref = "ktor" }
ktor-client-cio           = { module = "io.ktor:ktor-client-cio",                           version.ref = "ktor" }
ktor-client-test-host     = { module = "io.ktor:ktor-client-test-host",                    version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation",     version.ref = "ktor" }
ktor-client-logging       = { module = "io.ktor:ktor-client-logging",                       version.ref = "ktor" }
mcp-kotlin-sdk            = { module = "io.modelcontextprotocol:kotlin-sdk",                version.ref = "mcp" }
kotlinx-io                = { module = "org.jetbrains.kotlinx:kotlinx-io-core-jvm",           version.ref = "kotlinx-io" }
sqlite-jdbc               = { module = "org.xerial:sqlite-jdbc",                            version.ref = "sqliteJdbc" }
flyway-core               = { module = "org.flywaydb:flyway-core",                          version.ref = "flyway" }
telegrambots              = { module = "org.telegram:telegrambots",                         version.ref = "telegram" }
telegrambots-longpolling = { module = "org.telegram:telegrambots-longpolling",                version.ref = "telegram" }
telegrambots-client-jetty = { module = "org.telegram:telegrambots-client-jetty-adapter",         version.ref = "telegram" }
jgit                      = { module = "org.eclipse.jgit:org.eclipse.jgit",                 version.ref = "jgit" }
bouncycastle              = { module = "org.bouncycastle:bcprov-jdk18on",                   version.ref = "bouncycastle" }
pf4j                      = { module = "org.pf4j:pf4j",                                     version.ref = "pf4j" }
oras-sdk                  = { module = "land.oras:oras-java-sdk",                           version.ref = "oras" }
tomlj                     = { module = "org.tomlj:tomlj",                                   version.ref = "tomlj" }
kotlin-logging            = { module = "io.github.oshai:kotlin-logging-jvm",                version.ref = "kotlinLogging" }
logback-classic           = { module = "ch.qos.logback:logback-classic",                    version.ref = "logback" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder",      version.ref = "logstashEncoder" }
otel-api                  = { module = "io.opentelemetry:opentelemetry-api",                version.ref = "otel" }
otel-sdk                  = { module = "io.opentelemetry:opentelemetry-sdk",                version.ref = "otel" }
otel-exporter-otlp        = { module = "io.opentelemetry:opentelemetry-exporter-otlp",     version.ref = "otel" }
otel-autoconfigure        = { module = "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure", version.ref = "otel" }
junit-jupiter             = { module = "org.junit.jupiter:junit-jupiter",                   version.ref = "junit" }
junit-platform-launcher   = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions         = { module = "io.kotest:kotest-assertions-core",                  version.ref = "kotest" }
kotest-framework-engine   = { module = "io.kotest:kotest-framework-engine",                 version.ref = "kotest" }
kotest-junit-platform-runner = { module = "io.kotest:kotest-runner-junit5-jvm",             version.ref = "kotest" }
kotest-property            = { module = "io.kotest:kotest-property",                        version.ref = "kotest" }
jline                     = { module = "org.jline:jline",                                    version.ref = "jline" }
mockk                     = { module = "io.mockk:mockk",                                    version.ref = "mockk" }
testcontainers             = { module = "org.testcontainers:testcontainers",                version.ref = "testcontainers" }
clikt                     = { module = "com.github.ajalt.clikt:clikt",                      version.ref = "clikt" }
detekt-api                = { module = "io.gitlab.arturbosch.detekt:detekt-api",            version.ref = "detekt" }
detekt-test               = { module = "io.gitlab.arturbosch.detekt:detekt-test",           version.ref = "detekt" }

[bundles]
ktor-server = [
    "ktor-server-core",
    "ktor-server-netty",
    "ktor-server-cnegot",
    "ktor-server-sse",
    "ktor-server-websockets",
    "ktor-server-auth",
    "ktor-server-cors",
    "ktor-server-test-host",
    "ktor-serialization-json",
]
ktor-client = ["ktor-client-core", "ktor-client-cio", "ktor-client-content-negotiation", "ktor-client-logging", "ktor-serialization-json"]
logging     = ["kotlin-logging", "logback-classic"]
testing     = ["junit-jupiter", "kotest-assertions", "kotest-property", "mockk"]

[plugins]
kotlin-jvm            = { id = "org.jetbrains.kotlin.jvm",                  version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt                = { id = "io.gitlab.arturbosch.detekt",               version.ref = "detekt" }
ktlint                = { id = "org.jlleitschuh.gradle.ktlint",             version.ref = "ktlint" }
shadow                = { id = "com.gradleup.shadow",                       version.ref = "shadow" }
